spring:
  application:
    name: User-Service
  config:
      import: "optional:configserver:"
server:
  port:8081
eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms