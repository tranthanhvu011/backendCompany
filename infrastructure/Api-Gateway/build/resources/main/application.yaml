
server:
  port: 8080
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
spring:

  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:

         - id: auth-service
           uri: lb://USER-SERVICE
           predicates:
             - Path=/api/v1/auth/**
         - id: user-service
           uri: lb://USER-SERVICE
           predicates:
             - Path=/api/v1/user/**
        #   filters:
        #     - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

# JWT Configuration
jwt:
  secret: eW91ci0yNTYtYml0LXNlY3JldC1rZXktY2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg==
  expiration: 86400000
  refresh-expiration: 604800000
