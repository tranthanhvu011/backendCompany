# ===========================================
# ORDER-SERVICE CONFIGURATION
# ===========================================
# File này CHỈ dành riêng cho Order Service

server:
  port: 8087

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: OrderServiceHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Service-specific settings
order-service:
  order-expiration-minutes: 30
  max-items-per-order: 50
