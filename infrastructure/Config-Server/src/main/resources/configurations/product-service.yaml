# ===========================================
# PRODUCT-SERVICE CONFIGURATION
# ===========================================

server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/product-service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ProductServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Service-specific settings
product-service:
  default-page-size: 12
  max-page-size: 50
